aid: aws-glue
name: AWS Glue
description: AWS Glue is a fully managed serverless extract, transform, and load (ETL) service that makes
  it easy to discover, prepare, and combine data for analytics, machine learning, and application development.
  It provides a central data catalog, crawlers for automated metadata discovery, visual and code-based
  job authoring, and data quality capabilities. The Glue API uses AWS Signature Version 4 (SigV4) authentication
  and is accessed via SDKs, the AWS CLI, or direct HTTPS calls to regional service endpoints.
